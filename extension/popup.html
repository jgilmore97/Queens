<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 240px;
      padding: 16px;
      background: #fff;
      color: #1a1a1a;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.2px;
    }

    /* Server status pill */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #status-dot.ok   { background: #22c55e; }
    #status-dot.err  { background: #ef4444; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:not(:disabled):hover { opacity: 0.85; }

    #solve-btn {
      background: #0a66c2;
      color: #fff;
      margin-bottom: 8px;
    }

    #reset-btn {
      background: #f1f1f1;
      color: #333;
    }

    /* Batch placement toggle */
    #batch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 12px;
      color: #444;
    }

    .toggle { position: relative; display: inline-block; width: 34px; height: 18px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 18px;
      cursor: pointer; transition: background 0.2s;
    }
    .slider::before {
      content: ""; position: absolute;
      width: 12px; height: 12px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: transform 0.2s;
    }
    .toggle input:checked + .slider { background: #0a66c2; }
    .toggle input:checked + .slider::before { transform: translateX(16px); }

    /* Message area */
    #message {
      margin-top: 12px;
      font-size: 12px;
      color: #555;
      line-height: 1.5;
      min-height: 18px;
      white-space: pre-wrap;
    }
    #message.error { color: #dc2626; }
    #message.success { color: #16a34a; }
  </style>
</head>
<body>
  <h1>Queens Solver</h1>

  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-text">Checking server…</span>
  </div>

  <div id="batch-row">
    <span>Batch placement</span>
    <label class="toggle">
      <input type="checkbox" id="batch-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="solve-btn" class="btn" disabled>Solve Puzzle</button>
  <button id="reset-btn" class="btn" disabled>Reset Board</button>

  <div id="message"></div>

  <script src="popup.js"></script>
</body>
</html>
